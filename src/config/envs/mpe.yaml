env: mpe
common_reward: True
reward_scalarisation: mean

env_args:
  map_name: simple_spread_v3
  scenario: null  # Alias of map_name. If set (including via CLI), it selects the map.
  bootstrap_at_timeout: False  # True restores VIL2C Q-bootstrap; explodes QMIX on MPE.
  time_limit: 25
  seed: null
  render_mode: null
  scenario_args: {}

test_greedy: True
test_nepisode: 32
test_interval: 10000
log_interval: 10000
runner_log_interval: 10000
learner_log_interval: 10000
t_max: 2000000
