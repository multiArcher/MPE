# MAIC + QMIX. Official source: mansicer/MAIC (AAAI 2022).
# This repository's hidden_dim is the authors' rnn_hidden_dim.
name: "maic"
mac: "maic_mac"
agent: "maic"
learner: "maic_learner"
runner: "episode"
batch_size_run: 1
buffer_size: 5000
batch_size: 32
buffer_cpu_only: True
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0
agent_output_type: "q"
obs_last_action: True
obs_agent_id: True
hidden_dim: 64
latent_dim: 8
attention_dim: 32
nn_hidden_size: 64
mi_loss_weight: 0.001
entropy_loss_weight: 0.01
msg_l1_reg_loss_weight: 0
var_floor: 0.002
log_weights: True
optimiser: RMSprop
lr: 0.0005
optim_alpha: 0.99
optim_eps: 0.00001
gamma: 0.99
grad_norm_clip: 10
common_reward: True
standardise_rewards: False
standardise_returns: False
double_q: True
mixer: "qmix"
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64
# Official MAIC counts target copies in episodes, not gradient steps.
target_update_interval: 200
save_model: True
save_model_interval: 100000
obs_delay_enabled: False
obs_delay_apply_train: False
obs_delay_apply_test: False
obs_gaussian_delay_mean: 0.0
obs_gaussian_delay_std: 0.0
obs_delay_discretization: round
test_nepisode: 32
t_max: 2050000
